# Builds the site from data/site.json and publishes it to GitHub Pages
# every time main is updated (including edits made in the GitHub web editor).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh citation counts
        # Best effort: on a network or API failure the committed
        # data/citations.json is used instead, so the deploy still succeeds.
        continue-on-error: true
        run: node fetch-citations.js
      - name: Build pages from data/site.json
        run: node build.js
      - name: Collect public files
        run: |
          mkdir -p _site/images _site/blog _site/team
          cp *.html style.css globe.js favicon.ico felab.bib _site/
          cp sitemap.xml robots.txt feed.xml _site/
          cp -r images/. _site/images/
          cp -r blog/. _site/blog/
          cp -r team/. _site/team/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
